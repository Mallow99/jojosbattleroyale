<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Stand preview</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@900&display=block" rel="stylesheet">
<script type="importmap">{"imports":{"three":"./three/build/three.module.js","three/addons/":"./three/examples/jsm/"}}</script>
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { position: relative; width: 1280px; height: 720px; overflow: hidden; }
  .bar { position: absolute; left: 0; right: 0; height: 0; background: #000; z-index: 5; }
  #top { top: 0; } #bottom { bottom: 0; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; z-index: 6; }
  #tint { position: absolute; inset: 0; background: #6b3cff; mix-blend-mode: soft-light; opacity: 0; z-index: 4; }
  #title { position: absolute; left: 70px; bottom: 120px; z-index: 7; color: #fff; font-family: Bangers, Impact, sans-serif;
           opacity: 0; transform-origin: left center; }
  #title .label { font-size: 30px; letter-spacing: 3px; color: #ffd84a; -webkit-text-stroke: 1.5px #2a1050; }
  #title .name { font-size: 92px; line-height: 0.95; letter-spacing: 4px; color: #fff; -webkit-text-stroke: 3px #2a1050;
                 text-shadow: 6px 6px 0 #7a3cff; }
  .go { position: absolute; z-index: 6; font-family: "Unifont-JP", "Noto Sans JP", sans-serif; font-weight: 900; color: #b64dff;
        -webkit-text-stroke: 3px #ffffff; opacity: 0; font-size: 84px; }
  #caption { position: absolute; left: 12px; top: 8px; z-index: 9; color: #fff; font: 600 14px Inter, sans-serif; opacity: .75; }
</style>
</head>
<body>
<div id="stage">
  <div id="top" class="bar"></div><div id="bottom" class="bar"></div>
  <div id="flash"></div><div id="tint"></div>
  <div id="title"><div class="label">STAND NAME</div><div class="name">STAR PLATINUM</div></div>
  <div id="caption"></div>
</div>
<script type="module">
import { Preview } from "./viewer.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
const params = new URLSearchParams(location.search);
const scene = await (await fetch(params.get("scene") || "scene.json")).json();
const meshes = {};
if (scene.glb) {
  const gltf = await new GLTFLoader().loadAsync(scene.glb);
  gltf.scene.updateMatrixWorld(true);
  gltf.scene.traverse((o) => {
    if (o.isMesh) {
      const g = o.geometry.clone();
      g.applyMatrix4(o.matrixWorld);
      // glTF splits nodes per material: key by the node (object) name.
      const name = (o.parent && o.parent.type === "Object3D" && !o.name.includes("__")) ? o.parent.name : o.name;
      meshes[name] = { geometry: g, material: o.material };
    }
  });
}
await document.fonts.ready;
const stage = document.getElementById("stage");
const goSlots = [];
for (const slot of scene.menacing || []) {
  const el = document.createElement("div");
  el.className = "go";
  el.textContent = "ゴ";
  stage.appendChild(el);
  goSlots.push(el);
}
function overlay(frame) {
  const g = frame.gui || {};
  const bar = (g.letterbox || 0) * 0.11 * 720;
  document.getElementById("top").style.height = bar + "px";
  document.getElementById("bottom").style.height = bar + "px";
  document.getElementById("flash").style.opacity = g.flash || 0;
  document.getElementById("tint").style.opacity = (g.tint || 0) * 0.6;
  const title = document.getElementById("title");
  title.style.opacity = g.title || 0;
  title.style.transform = `translateX(${(1 - (g.title || 0)) * -60}px) skewX(-8deg)`;
  (scene.menacing || []).forEach((slot, i) => {
    const el = goSlots[i];
    const a = (g.menacing || 0);
    const pulse = 1 + 0.08 * Math.sin((frame.t * 6 + i * 1.3));
    el.style.left = slot[0] * 1280 + "px";
    el.style.top = slot[1] * 720 + "px";
    el.style.opacity = a;
    el.style.transform = `scale(${slot[2] * pulse}) rotate(${slot[3]}deg)`;
  });
  document.getElementById("caption").textContent = frame.caption || "";
}
const preview = new Preview(stage, scene, { overlay, meshes });
window.frameCount = scene.frames.length;
window.renderFrame = (i) => { preview.setFrame(scene.frames[i]); return true; };
window.renderFrame(0);
window.ready = true;
</script>
</body>
</html>
