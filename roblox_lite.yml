---
# Roblox globals for Selene. Selene's generated Roblox standard library could not be
# downloaded in the cloud workspace, so fields are unchecked here; luau-lsp with the
# pinned Roblox definitions does the real API type checking.
base: luau
name: roblox_lite
globals:
  game: { any: true }
  workspace: { any: true }
  script: { any: true }
  plugin: { any: true }
  Enum: { any: true }
  Instance: { any: true }
  Vector2: { any: true }
  Vector3: { any: true }
  CFrame: { any: true }
  Color3: { any: true }
  BrickColor: { any: true }
  UDim: { any: true }
  UDim2: { any: true }
  Rect: { any: true }
  Ray: { any: true }
  Region3: { any: true }
  NumberRange: { any: true }
  NumberSequence: { any: true }
  NumberSequenceKeypoint: { any: true }
  ColorSequence: { any: true }
  ColorSequenceKeypoint: { any: true }
  TweenInfo: { any: true }
  RaycastParams: { any: true }
  OverlapParams: { any: true }
  Random: { any: true }
  DateTime: { any: true }
  PhysicalProperties: { any: true }
  task: { any: true }
  tick: { any: true }
  time: { any: true }
  warn: { any: true }
  settings: { any: true }
  UserSettings: { any: true }
